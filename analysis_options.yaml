include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.pigeon.dart"
    - "**/build/**"
    - "**/android/**"
    - "**/ios/**"

linter:
  rules:
    public_member_api_docs: true
    # Ports are deliberately small interfaces, some with a single method.
    # Plain statements read better than long cascades in tests.
    cascade_invocations: false

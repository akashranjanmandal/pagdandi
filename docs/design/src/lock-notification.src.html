<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagdandi lock notification</title>
<style>{{CSS}}
.lock{flex:1;background:#000;padding:48px 14px 14px;display:flex;flex-direction:column;gap:14px}
.clock{text-align:center;font:400 72px/1 var(--f-cond);color:var(--text)} .date{text-align:center;color:var(--text2);margin-top:-6px}
.notif{background:var(--raised);border-radius:16px;padding:12px 14px;border:var(--line) solid var(--hair)}
.notif .app{display:flex;align-items:center;gap:8px;font:400 12px var(--f-text);color:var(--text2);margin-bottom:6px}
.notif .l1{font:500 16px var(--f-text)} .notif .l2{font:400 14px var(--f-text);color:var(--text);margin-top:2px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .a{flex:1;min-height:56px;border-radius:12px;border:var(--line) solid var(--key-rim);border-bottom:4px solid var(--key-edge);background:var(--key);display:flex;align-items:center;justify-content:center;gap:6px;font:500 14px var(--f-text);color:var(--text)}
.acts .a.sos{color:var(--sos)}
</style>
</head>
<body>
{{SPRITE}}
{{BAR}}
<div class="layout">
<div class="phone" id="phone" aria-label="Lock screen"></div>
<aside class="side">
  <div class="grp"><h2>State</h2><div class="ctl" id="c-state"></div></div>
  <div class="grp"><h2>Notes</h2><p class="label">Reasons, states, copy: <b>lock-notification.md</b>. The notification is the app for most of a trek: phone locked, music playing.</p></div>
</aside>
</div>
<script>{{BASE_JS}}</script>
<script>
(function(){
'use strict';
const {$,ic,mkCtl}=P;
let st='tracking';
const N={
 tracking:['Tracking · 2.4 km walked','+180 m climb · battery 78% · solo',false],
 sos:['SOS active','SMS delivered to 2 of 3 · beacon on',true],
 dead:['Trek engine stopped','Restarting it now. SOS messages still go out.',false],
 resume:['Tap to resume trek','The phone restarted. Open Pagdandi to keep tracking.',false]
};
function render(){
  const n=N[st];
  $('#phone').innerHTML=`<div class="lock"><div class="clock">14:32</div><div class="date">Tuesday 27 October</div><div style="flex:1"></div>
  <div class="notif" role="group" aria-label="Pagdandi notification"><div class="app">${ic('pin','',"width:14px;height:14px")} Pagdandi · now</div><div class="l1" style="${n[2]?'color:var(--sos)':''}">${n[0]}</div><div class="l2">${n[1]}</div>
  ${st==='tracking'?`<div class="acts"><div class="a">${ic('card')}Emergency card</div><div class="a sos" id="sosb">${ic('octagon')}SOS</div></div>`:''}${st==='sos'?`<div class="acts"><div class="a">${ic('card')}Emergency card</div><div class="a">${ic('call')}Call 112</div></div>`:''}</div>
  <div class="caption" style="text-align:center">SOS opens a hold-to-confirm screen. It never sends from the notification.</div></div>`;
  const b=$('#sosb'); if(b) b.onclick=()=>P.hap('opens the SOS hold screen over the lock screen · nothing is sent yet',10);
  P.apply();
}
mkCtl($('#c-state'),[['tracking','Tracking'],['sos','SOS active'],['dead','Core stopped'],['resume','After reboot']],s=>{st=s;render()},true);
P.listeners.push(render);
render();
})();
</script>
</body>
</html>

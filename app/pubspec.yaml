name: pagdandi_app
description: "Pagdandi UI, a thin client that renders state and sends commands."
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.13.2
dependencies:
  clock: ^1.1.0
  core_common:
  core_db:
  core_geo:
  core_model:
  core_ports:
  device_info_plus: ^13.0.0
  drift: ^2.35.0
  engine_health:
  engine_navigation:
  engine_safety:
  engine_tracking:
  engine_trekstate:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  meta: ^1.19.0
  native_bridge:
  path_drawing: ^1.0.1
  permission_handler: ^12.0.0
  trek_core:
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  testing:
flutter:
  uses-material-design: false
  assets:
    - assets/routes/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
